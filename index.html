<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Cards</title>
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("neo-cards-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="page-title">Neo Cards</h1>
    <div class="tools">
    <button id="fontBtn" class="icon-btn" type="button" aria-label="Choose font"><b>Aa</b></button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Choose theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
    </button>
    <button id="tplBtn" class="icon-btn" type="button" aria-label="Choose template">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    </button>
    </div>
  </div>
  <label class="upload">
    <span id="uploadText">Choose your Spotify history file</span>
    <input id="file" type="file" accept=".zip,.json" multiple>
  </label>
  <p class="note">Upload the .zip from Spotify’s extended streaming history, or its Streaming_History_Audio .json files. Your data stays in your browser.</p>
  <p class="error" id="error" hidden></p>

  <div class="controls" id="controls" hidden>
    <select id="artist" aria-label="Artist"></select>
    <select id="year" aria-label="Period"></select>
  </div>
  <div class="card" id="card" hidden></div>
</div>

<dialog id="themeDialog" aria-labelledby="themeTitle">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2 id="themeTitle">Theme</h2>
      <button id="themeClose" class="icon-btn" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="swatches" id="swatches"></div>
  </div>
</dialog>

<dialog id="fontDialog" aria-labelledby="fontTitle">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2 id="fontTitle">Font</h2>
      <button id="fontClose" class="icon-btn" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="swatches" id="fonts"></div>
  </div>
</dialog>

<dialog id="tplDialog" aria-labelledby="tplTitle">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2 id="tplTitle">Templates</h2>
      <button id="tplClose" class="icon-btn" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="tpl-list" id="templates"></div>
  </div>
</dialog>

<script src="the-spooky-part/app.js"></script>
</body>
</html>
